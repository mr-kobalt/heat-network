services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: heating
      POSTGRES_USER: heating
      POSTGRES_PASSWORD: heating
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heating -d heating"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Опциональный визуализатор (ADR-0013). По умолчанию не поднимается:
  # docker compose --profile frontend up
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Базовый URL API — без суффикса /api (пути клиента уже включают /api,
        # nginx проксирует /api -> app:8080).
        VITE_API_BASE_URL: ""
    depends_on:
      app:
        condition: service_started
    ports:
      - "8081:80"

volumes:
  pgdata:
  appdata:
