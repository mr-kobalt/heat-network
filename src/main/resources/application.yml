spring:
  application:
    name: heating-routing-service

  datasource:
    # Единая БД — контейнер `db` из docker-compose (ADR-0017), TCP localhost:5432.
    # Переопределяется через SPRING_DATASOURCE_* / HEATING_DB_*.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${HEATING_DB_HOST:localhost}:${HEATING_DB_PORT:5432}/${HEATING_DB_NAME:heating}}
    username: ${SPRING_DATASOURCE_USERNAME:heating}
    password: ${SPRING_DATASOURCE_PASSWORD:heating}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: always

  servlet:
    multipart:
      # Потоковая обработка: всегда спуливать на диск, не держать в ОЗУ (NFR-08).
      file-size-threshold: 0
      max-file-size: 3GB
      max-request-size: 3GB

server:
  port: 8080
  tomcat:
    max-swallow-size: -1
  error:
    include-message: always

springdoc:
  # ADR-0075: документация API. UI — /swagger-ui.html, спецификация — /v3/api-docs.
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

heating:
  app:
    storage-root: ${HEATING_STORAGE_ROOT:./data}
    worker-threads: ${HEATING_WORKER_THREADS:1}
    default-diameter-mm: 400
    # FR-58: округление расстояний вверх при отклонении не более допуска.
    rounding-tolerance-m: 0.01
    # ADR-0037: сэмплирование сети кандидатами врезки и радиус исключения у камер.
    tie-in-sample-step-m: ${HEATING_TIE_IN_SAMPLE_STEP_M:1.0}
    tie-in-chamber-exclusion-m: ${HEATING_TIE_IN_CHAMBER_EXCLUSION_M:1.0}
    # FR-22/FR-71: в пределах радиуса врезаемся в существующую камеру.
    chamber-tie-in-radius-m: 10.0
    # ADR-0027: алгоритм трассировки по умолчанию (см. GET /api/v1/algorithms).
    routing-algorithm: ${HEATING_ROUTING_ALGORITHM:grid-forest}
    # ADR-0034: поиск пути по сетке (ячейка и бюджет клеток).
    forest-grid-cell-m: ${HEATING_FOREST_GRID_CELL_M:1.0}
    # ADR-0041: форма сетки поиска пути (square | hex).
    forest-grid-shape: ${HEATING_FOREST_GRID_SHAPE:hex}
    forest-grid-max-cells: ${HEATING_FOREST_GRID_MAX_CELLS:16000000}
    forest-cost-iterations: ${HEATING_FOREST_COST_ITERATIONS:2}
    # ADR-0033 (фаза B): хранилище состояния сетки (спилл в PostGIS TEMP).
    forest-grid-storage: ${HEATING_FOREST_GRID_STORAGE:auto}
    forest-grid-page-cells: ${HEATING_FOREST_GRID_PAGE_CELLS:256}
    forest-grid-cache-mb: ${HEATING_FOREST_GRID_CACHE_MB:512}
    # FR-34/ТП 2.1: ограничение угла поворота трассы (0° — прямая, ≤ 90°).
    forest-max-turn-deg: ${HEATING_FOREST_MAX_TURN_DEG:90}
    forest-turn-enforcement: ${HEATING_FOREST_TURN_ENFORCEMENT:hard}
    # ADR-0034: локальный ремонт поворотов в refine и grid-заход на выход.
    forest-refine-local-passes: ${HEATING_FOREST_REFINE_LOCAL_PASSES:2}
    forest-exit-grid-dogleg: ${HEATING_FOREST_EXIT_GRID_DOGLEG:true}
    # ADR-0035: переприсоединение терминалов (T-врезка).
    forest-reattach-pass: ${HEATING_FOREST_REATTACH_PASS:true}
    forest-reattach-iterations: ${HEATING_FOREST_REATTACH_ITERATIONS:2}
    # ADR-0044: перестройка дерева — перенос промежуточных узлов с поддеревом.
    forest-relink-nodes: ${HEATING_FOREST_RELINK_NODES:true}
    forest-relink-nodes-radius-m: ${HEATING_FOREST_RELINK_NODES_RADIUS_M:100.0}
    # FR-26: предельная степень камеры.
    forest-max-chamber-degree: ${HEATING_FOREST_MAX_CHAMBER_DEGREE:4}
    # ADR-0039: разрешить relink менять выход, выбранный growth (по умолчанию — нет).
    forest-relink-exit-relocation: ${HEATING_FOREST_RELINK_EXIT_RELOCATION:false}
    forest-relink-exit-candidates-max: ${HEATING_FOREST_RELINK_EXIT_CANDIDATES_MAX:6}
    # R1: предел T-точек на ребро при переборе врезок в relink (0 — без предела).
    # Дефолт 64: ≈2× быстрее relink; основной набор S 13.5598 → 13.5752.
    forest-relink-tpoint-max: ${HEATING_FOREST_RELINK_TPOINT_MAX:64}
    # R2: безопасное досрочное прерывание оценки хода relink.
    forest-relink-cost-bound: ${HEATING_FOREST_RELINK_COST_BOUND:true}
    # R3: kNN-отбор кандидатов relink (0 — полный перебор).
    # Дефолт 16: идентичный S на проверочных наборах, relink ≈3× быстрее.
    forest-relink-candidate-k: ${HEATING_FOREST_RELINK_CANDIDATE_K:16}
    forest-relink-candidate-radius-m: ${HEATING_FOREST_RELINK_CANDIDATE_RADIUS_M:0.0}
    # R5a: учитывать Kспец в оценке хода relink (false — прежняя прокси-оценка, A/B).
    forest-relink-special-cost: ${HEATING_FOREST_RELINK_SPECIAL_COST:true}
    # R5b: учитывать предельную длину при подборе Ду в relink (false — только расход, A/B).
    forest-relink-length-cost: ${HEATING_FOREST_RELINK_LENGTH_COST:true}
    # ADR-0040: фильтрация выходов-кандидатов ОКС (соседние корпуса, возврат, глубина).
    oks-exit-filter: ${HEATING_OKS_EXIT_FILTER:true}
    oks-exit-max-tail-m: ${HEATING_OKS_EXIT_MAX_TAIL_M:15.0}
    # E36: сдвиг выхода ОКС при широком зазоре (0 — выключено; +1 м даёт место, но
    # на плотных наборах вносит пересечения FR-29).
    oks-exit-extra-buffer-m: ${HEATING_OKS_EXIT_EXTRA_BUFFER_M:0.0}
    oks-owning-include-boundary: ${HEATING_OKS_OWNING_INCLUDE_BOUNDARY:true}
    # ADR-0037: границы сетки включают bbox всех входных объектов.
    forest-grid-include-input-bounds: ${HEATING_FOREST_GRID_INCLUDE_INPUT_BOUNDS:true}
    # Запас тайла партиционирования, если forest-partition-margin-m не задан.
    forest-cluster-margin-m: ${HEATING_FOREST_CLUSTER_MARGIN_M:2000.0}
    # E8-15d2c: пространственное партиционирование входа (0 — выключено).
    forest-partition-tile-m: ${HEATING_FOREST_PARTITION_TILE_M:0.0}
    forest-partition-margin-m: ${HEATING_FOREST_PARTITION_MARGIN_M:0.0}
    # E8-15d2c2: не подменять канонический выход при локальной недостижимости (FR-43).
    forest-preserve-canonical-exits: ${HEATING_FOREST_PRESERVE_CANONICAL_EXITS:false}
    # E25/ADR-0045: строгий обход спецпроходов (полоса непроходима, пересечение
    # через «ворота» перпендикулярно оси). По умолчанию выключено.
    forest-special-strict: ${HEATING_FOREST_SPECIAL_STRICT:true}
    special-gate-step-m: ${HEATING_SPECIAL_GATE_STEP_M:5.0}
    special-gate-thickness-m: ${HEATING_SPECIAL_GATE_THICKNESS_M:1.0}
    # E25-07: адаптивное уменьшение шага «ворот» при неподключённых точках.
    forest-gate-retries: ${HEATING_FOREST_GATE_RETRIES:2}
    # E35: оптимизация точки врезки корня (перпендикулярная проекция на сеть).
    forest-root-optimization: ${HEATING_FOREST_ROOT_OPTIMIZATION:true}
    # ADR-0051: оптимизация положения новых камер (медиана соседей + стыки).
    forest-chamber-optimization: ${HEATING_FOREST_CHAMBER_OPTIMIZATION:true}
    forest-chamber-search-radius-cells: ${HEATING_FOREST_CHAMBER_SEARCH_RADIUS_CELLS:3.0}
    forest-chamber-max-candidates: ${HEATING_FOREST_CHAMBER_MAX_CANDIDATES:25}
    # E8-14: бюджеты дорогого обхода стыка камеры/корня (gridPath/visibilityPath).
    forest-chamber-grid-expansions: ${HEATING_FOREST_CHAMBER_GRID_EXPANSIONS:4000}
    forest-chamber-visibility-max-nodes: ${HEATING_FOREST_CHAMBER_VISIBILITY_MAX_NODES:100}
    forest-chamber-passes: ${HEATING_FOREST_CHAMBER_PASSES:1}
    # E50-05: объединение близких новых камер (Steiner-vertex merge).
    forest-chamber-merge: ${HEATING_FOREST_CHAMBER_MERGE:true}
    # Ремонт углов для каждого кандидата merge (false — валидация без ремонта, быстрее).
    forest-chamber-merge-repair: ${HEATING_FOREST_CHAMBER_MERGE_REPAIR:true}
    forest-chamber-merge-passes: ${HEATING_FOREST_CHAMBER_MERGE_PASSES:1}
    # Минимальный угол между парой рёбер в тепловой камере, град (≥).
    forest-chamber-min-angle-deg: ${HEATING_FOREST_CHAMBER_MIN_ANGLE_DEG:30.0}
    # E25-05b: буферы по фактическому Ду (пересборка индекса и повтор расчёта).
    forest-diameter-aware-buffers: ${HEATING_FOREST_DIAMETER_AWARE_BUFFERS:false}
    forest-diameter-aware-iterations: ${HEATING_FOREST_DIAMETER_AWARE_ITERATIONS:2}
    # E50-07/ADR-0065: visibility-фолбэк терминального ребра в узком коридоре.
    forest-exit-visibility-fallback: ${HEATING_FOREST_EXIT_VISIBILITY_FALLBACK:true}
    forest-exit-visibility-min-detour-m: ${HEATING_FOREST_EXIT_VISIBILITY_MIN_DETOUR_M:2.0}
    forest-exit-visibility-max-detour-m: ${HEATING_FOREST_EXIT_VISIBILITY_MAX_DETOUR_M:10.0}
    forest-exit-visibility-max-attempts: ${HEATING_FOREST_EXIT_VISIBILITY_MAX_ATTEMPTS:200}
    forest-exit-visibility-max-nodes: ${HEATING_FOREST_EXIT_VISIBILITY_MAX_NODES:200}
    # ADR-0066/E50-08: регуляризация выхода терминала (спрямление, привязка камеры).
    forest-exit-regularization: ${HEATING_FOREST_EXIT_REGULARIZATION:true}
    forest-exit-snap-m: ${HEATING_FOREST_EXIT_SNAP_M:1.0}
    forest-exit-micro-m: ${HEATING_FOREST_EXIT_MICRO_M:0.5}
    # ADR-0062: глобальный оптимизатор Ду на всё дерево (участки + камеры).
    forest-diameter-optimizer: ${HEATING_FOREST_DIAMETER_OPTIMIZER:true}
    forest-diameter-optimizer-max-states: ${HEATING_FOREST_DIAMETER_OPTIMIZER_MAX_STATES:500000}
    # E26/ADR-0046: правило 10 м и учёт существующих примыканий (степень ≤4).
    forest-chamber-tie-in-rules: ${HEATING_FOREST_CHAMBER_TIE_IN_RULES:true}
    # ADR-0036: предел пикселей растровой диагностики сетки (прореживание).
    trace-grid-max-pixels: ${HEATING_TRACE_GRID_MAX_PIXELS:4194304}
    # ADR-0073 / ТП v2 §5: режим с учётом глубины (mode=depth).
    depth-normal-m: ${HEATING_DEPTH_NORMAL_M:3.0}
    depth-min-m: ${HEATING_DEPTH_MIN_M:0.7}
    depth-max-slope: ${HEATING_DEPTH_MAX_SLOPE:0.10}
    # Допущение: вертикальный зазор до коммуникации (ТП чисел не задаёт), м.
    depth-vertical-clearance-m: ${HEATING_DEPTH_VERTICAL_CLEARANCE_M:0.2}
    # Допущение вместо NQ-05: «близкие» пересечения не возвращаются на 3,0 м, м.
    depth-close-crossing-m: ${HEATING_DEPTH_CLOSE_CROSSING_M:5.0}
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8081
  # ТП 8, 9: коэффициенты стоимости и ранжирования (FR-70…FR-76).
  cost:
    # FR-73: врезка в существующую камеру — 5 000 000 руб. за участок.
    existing-chamber-tie-in-cost: 5000000
    chamber-small-max-dn: 200
    chamber-medium-max-dn: 500
    chamber-large-max-dn: 1000
    chamber-cost-small: 3000000
    chamber-cost-medium: 5000000
    chamber-cost-large: 8000000
    chamber-cost-extra-large: 12000000
    unconnected-base-cost: 100000000
    unconnected-cost-per-tph: 500000
    score-cost-base: 25000000
    score-length-base: 100
    score-cost-weight: 0.7
    score-length-weight: 0.3
  # ТП v2, таблица 1: Ду, пропускная способность, предельная длина,
  # стоимость нового строительства (руб./м).
  diameters:
    - {dn: 50,   capacity-tph: 3.5,      max-length-m: 181,   new-cost-per-m: 74023}
    - {dn: 65,   capacity-tph: 8.3,      max-length-m: 245,   new-cost-per-m: 78631}
    - {dn: 80,   capacity-tph: 13.2,     max-length-m: 327,   new-cost-per-m: 83530}
    - {dn: 100,  capacity-tph: 22.3,     max-length-m: 419,   new-cost-per-m: 89748}
    - {dn: 125,  capacity-tph: 40.2,     max-length-m: 554,   new-cost-per-m: 97275}
    - {dn: 150,  capacity-tph: 65.1,     max-length-m: 696,   new-cost-per-m: 105507}
    - {dn: 200,  capacity-tph: 152.3,    max-length-m: 1042,  new-cost-per-m: 120275}
    - {dn: 250,  capacity-tph: 274.9,    max-length-m: 1379,  new-cost-per-m: 135323}
    - {dn: 300,  capacity-tph: 437.4,    max-length-m: 1718,  new-cost-per-m: 150022}
    - {dn: 400,  capacity-tph: 943.1,    max-length-m: 2477,  new-cost-per-m: 190299}
    - {dn: 500,  capacity-tph: 1663.4,   max-length-m: 3245,  new-cost-per-m: 224137}
    - {dn: 600,  capacity-tph: 2627.7,   max-length-m: 4037,  new-cost-per-m: 264790}
    - {dn: 700,  capacity-tph: 3735.1,   max-length-m: 4775,  new-cost-per-m: 324298}
    - {dn: 800,  capacity-tph: 5296.8,   max-length-m: 5644,  new-cost-per-m: 325996}
    - {dn: 900,  capacity-tph: 7165.0,   max-length-m: 6518,  new-cost-per-m: 327693}
    - {dn: 1000, capacity-tph: 9391.8,   max-length-m: 7419,  new-cost-per-m: 418777}
    - {dn: 1200, capacity-tph: 15012.8,  max-length-m: 9288,  new-cost-per-m: 428074}
    - {dn: 1400, capacity-tph: 22501.9,  max-length-m: 11276, new-cost-per-m: 683417}
  # ТП v2, таблица 1: расчётные габариты пары труб (наружный диаметр оболочки,
  # просвет, ширина пары, высота). Используются при проверке расстояний (FR-59).
  envelopes:
    - {dn: 50,   pair-width-m: 0.400, height-m: 0.125}
    - {dn: 65,   pair-width-m: 0.430, height-m: 0.140}
    - {dn: 80,   pair-width-m: 0.470, height-m: 0.160}
    - {dn: 100,  pair-width-m: 0.510, height-m: 0.180}
    - {dn: 125,  pair-width-m: 0.600, height-m: 0.225}
    - {dn: 150,  pair-width-m: 0.650, height-m: 0.250}
    - {dn: 200,  pair-width-m: 0.880, height-m: 0.315}
    - {dn: 250,  pair-width-m: 1.050, height-m: 0.400}
    - {dn: 300,  pair-width-m: 1.150, height-m: 0.450}
    - {dn: 400,  pair-width-m: 1.370, height-m: 0.560}
    - {dn: 500,  pair-width-m: 1.670, height-m: 0.710}
    - {dn: 600,  pair-width-m: 1.850, height-m: 0.800}
    - {dn: 700,  pair-width-m: 2.050, height-m: 0.900}
    - {dn: 800,  pair-width-m: 2.250, height-m: 1.000}
    - {dn: 900,  pair-width-m: 2.450, height-m: 1.100}
    - {dn: 1000, pair-width-m: 2.650, height-m: 1.200}
    - {dn: 1200, pair-width-m: 3.100, height-m: 1.425}
    - {dn: 1400, pair-width-m: 3.450, height-m: 1.600}
  # ТП v2, таблица 2: конфигурируемые правила ограничений (ADR-0009).
  restrictions:
    fallback:
      mode: PROHIBITED
      min-distance-m: 1.0
    rules:
      oks:
        mode: PROHIBITED
        min-distance-m: 9.0
        distance-bands:
          - {max-dn: 499, distance-m: 5.0}
          - {max-dn: 800, distance-m: 7.0}
          - {max-dn: 100000, distance-m: 9.0}
      park: {mode: PROHIBITED, min-distance-m: 1.0}
      social_area: {mode: PROHIBITED, min-distance-m: 1.0}
      prohibited_site: {mode: PROHIBITED, min-distance-m: 1.0}
      water: {mode: PROHIBITED, min-distance-m: 1.0}
      # FR-57 (ТП v2, таблица 2): railway — пересечение запрещено, 1,0 м.
      railway: {mode: PROHIBITED, min-distance-m: 1.0}
      road: {mode: SPECIAL, min-distance-m: 1.5, angle-min-deg: 45, k-special: 1.60, special-zone-buffer-m: 3.0}
      tram_tracks: {mode: SPECIAL, min-distance-m: 1.5, angle-min-deg: 45, k-special: 1.75, special-zone-buffer-m: 3.0}
      # ADR-0073, таблица 4: вертикальные габариты для режима глубины
      # (глубина до верха габарита / высота габарита, м).
      gas_pipeline: {mode: SPECIAL, min-distance-m: 2.0, k-special: 1.25, vertical-top-depth-m: 2.8, vertical-height-m: 0.4}
      power_cable: {mode: SPECIAL, min-distance-m: 2.0, k-special: 1.15, vertical-top-depth-m: 2.7, vertical-height-m: 0.2}
      heat_network: {mode: SPECIAL, min-distance-m: 1.0, k-special: 1.05, vertical-top-depth-m: 3.0, vertical-height-m: 0.45}

logging:
  level:
    ru.lct.heating: INFO
